{% extends 'base.html' %}

{% block title %}Categorias - Controle de Gastos{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Categorias</h2>
    <a href="{% url 'criar_categoria' %}" class="btn btn-success">Nova Categoria</a>
</div>

<div class="table-responsive">
    <table class="table table-striped table-hover">
        <thead class="table-light">
            <tr>
                <th>Nome</th>
                <th>Tipo</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for cat in categorias %}
                <tr>
                    <td>{{ cat.nome }}</td>
                    <td>{{ cat.get_tipo_display }}</td>
                    <td>
                        <a href="{% url 'editar_categoria' cat.id %}" class="btn btn-sm btn-primary">Editar</a>
                        <a href="{% url 'excluir_categoria' cat.id %}" class="btn btn-sm btn-danger">Excluir</a>
                    </td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="3" class="text-center text-muted py-4">Nenhuma categoria</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
