{% extends 'base.html' %}

{% block title %}Confirmar Exclusão - Controle de Gastos{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h3 class="mb-4 text-danger">Confirmar Exclusão</h3>
        
        <div class="border p-3 mb-4">
            <p><strong>Nome:</strong> {{ categoria.nome }}</p>
            <p><strong>Tipo:</strong> {{ categoria.get_tipo_display }}</p>
        </div>

        <p class="text-muted small mb-3">Tem certeza? Esta ação não pode ser desfeita.</p>

        <form method="post" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Excluir</button>
            <a href="{% url 'lista_categorias' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
